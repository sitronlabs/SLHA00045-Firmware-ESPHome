esphome:
  name: slha00045
  friendly_name: SLHA00045
  name_add_mac_suffix: true

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

# Active les logs série/OTA pour le debug
logger:

# Intégration API Home Assistant
api:

# Mise à jour OTA sécurisée
ota:
  - platform: esphome

# Configuration du Wi-Fi
wifi:
  ap:

# Portail captif pour la configuration via le hotspot
captive_portal:

# LED verte en PWM (voyant de chauffage), LED rouge en GPIO (erreur capteur)
output:
  - platform: ledc
    pin: GPIO1
    id: led_verte_output
    zero_means_zero: true

  - platform: gpio
    pin: GPIO11
    id: led_rouge_output

light:
  - platform: monochromatic
    name: "LED Verte"
    id: led_verte
    output: led_verte_output
    internal: true # Non visible dans l'interface Home Assistant
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF

  - platform: binary
    name: "LED Rouge"
    id: led_rouge
    output: led_rouge_output
    internal: true # Non visible dans l'interface Home Assistant

# Luminosité du voyant vert, mémorisée après redémarrage
number:
  - platform: template
    name: "Voyant de chauffage"
    id: voyant_chauffage
    icon: mdi:brightness-percent
    optimistic: true
    restore_value: true
    initial_value: 100
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    mode: slider
    set_action:
      - if:
          condition:
            light.is_on: led_verte
          then:
            - light.turn_on:
                id: led_verte
                brightness: !lambda 'return x / 100.0f;'

# Définition des sorties GPIO pour le pilotage du fil pilote
switch:
  - platform: gpio
    pin: GPIO22
    name: "Fil Pilote N"
    id: pilote_n
    restore_mode: ALWAYS_ON # Redémarrage en hors-gel pour plus de sécurité
    internal: true # Non visible dans l'interface Home Assistant

  - platform: gpio
    pin: GPIO23
    name: "Fil Pilote P"
    id: pilote_p
    restore_mode: ALWAYS_OFF # Redémarrage en hors-gel pour plus de sécurité
    internal: true # Non visible dans l'interface Home Assistant

# Bus I2C pour le capteur AHT20 (Température et Humidité)
i2c:
  sda: GPIO6
  scl: GPIO7
  scan: true

# Capteur de température et d’humidité (AHT20)
sensor:
  - platform: aht10
    id: aht20
    variant: AHT20
    temperature:
      name: "Température"
      id: aht20_temperature
    humidity:
      name: "Humidité"
      id: aht20_humidity
    update_interval: 5s # Rafraîchissement toutes les 5 secondes

# Clignotement LED rouge si le AHT20 est absent ou en panne
interval:
  - interval: 400ms
    then:
      - if:
          condition:
            lambda: 'return id(aht20).is_failed() || id(aht20).status_has_warning();'
          then:
            - light.toggle: led_rouge
          else:
            - if:
                condition:
                  light.is_on: led_rouge
                then:
                  - light.turn_off: led_rouge

# Thermostat basé sur la température (chauffage uniquement)
climate:
  - platform: thermostat
    name: "Thermostat"
    sensor: aht20_temperature
    humidity_sensor: aht20_humidity
    min_heating_off_time: 0s
    min_heating_run_time: 0s
    min_idle_time: 0s
    heat_deadband: 0.1
    heat_overrun: 0.1

    # Actions à effectuer en mode chauffage
    heat_action:
      - switch.turn_off: pilote_n # Demi-alternances positive et négative coupées, mode confort
      - light.turn_on:
          id: led_verte
          brightness: !lambda |-
            if (isnan(id(voyant_chauffage).state)) return 1.0f;
            return id(voyant_chauffage).state / 100.0f;

    # Actions à effectuer en mode repos (arrêt du chauffage)
    idle_action:
      - light.turn_off: led_verte
      - switch.turn_on: pilote_n # Demi-alternance negative seule, mode hors-gel

# LED de statut ESPHome (jaune, Wi‑Fi / API)
status_led:
  pin: GPIO10
